<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZSaldo • Criar Conta</title>
  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Orbitron:wght@500;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="assets/background.mp4" type="video/mp4">
    Seu navegador não suporta vídeo em background.
  </video>

  <div class="bg-overlay"></div>

  <div id="globalLoader" class="loader hidden">
    <div class="spinner"></div>
    <p class="loader-message" role="status">Aviso: Esse processo pode levar um tempo.</p>
  </div>

  <div class="main-logo">
    <span class="ez">EZ</span><span class="saldo">Saldo</span>
  </div>

  <div class="container">
    <h2>Criar Conta</h2>

    <form id="registerForm">
      <div class="avatar-upload">
        <div class="avatar-preview-wrapper">
          <button type="button" id="avatarPickerBtn" class="avatar-preview-mask" aria-label="Adicionar imagem de perfil"
            title="Adicionar imagem de perfil">
            <img id="avatarPreview" class="avatar-preview hidden" alt="Prévia da foto de perfil">
            <span id="avatarPlaceholder" class="avatar-placeholder">
            </span>
          </button>

          <button type="button" id="removeImageBtn" class="avatar-remove-btn hidden" aria-label="Remover imagem"
            title="Remover imagem"></button>
        </div>

        <input type="file" id="profileImage" accept="image/*" hidden>
        <p id="avatarTip" class="avatar-tip">Clique no ícone acima para escolher uma imagem</p>
      </div>

      <input type="text" id="name" placeholder="Nome completo" autocomplete="name" autocapitalize="words" required>
      <input type="email" id="email" placeholder="Email" required>

      <div class="input-group">
        <input type="password" id="password" placeholder="Senha" minlength="6" required>

        <button type="button" class="toggle-password" aria-label="Mostrar senha" aria-pressed="false">
          <svg class="eye-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path class="eye-open" d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            <circle class="eye-open" cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.8" />
            <path class="eye-closed" d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <path class="eye-closed" d="M9.9 4.24A10.94 10.94 0 0 1 12 4c6.5 0 10 6 10 6a16.7 16.7 0 0 1-3.02 3.59"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            <path class="eye-closed" d="M6.61 6.61A16.1 16.1 0 0 0 2 12s3.5 6 10 6a10.4 10.4 0 0 0 4.24-.85"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>

      <div class="input-group">
        <input type="password" id="confirmPassword" placeholder="Confirmar senha" minlength="6" required>

        <button type="button" class="toggle-password" aria-label="Mostrar senha" aria-pressed="false">
          <svg class="eye-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path class="eye-open" d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            <circle class="eye-open" cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.8" />
            <path class="eye-closed" d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <path class="eye-closed" d="M9.9 4.24A10.94 10.94 0 0 1 12 4c6.5 0 10 6 10 6a16.7 16.7 0 0 1-3.02 3.59"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            <path class="eye-closed" d="M6.61 6.61A16.1 16.1 0 0 0 2 12s3.5 6 10 6a10.4 10.4 0 0 0 4.24-.85"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>

      <button type="submit">Cadastrar</button>
      <p id="registerError" class="error-message"></p>
    </form>

    <p>Já tem conta? <a href="login.html">Entrar</a></p>
  </div>

  <div id="cropModal" class="crop-modal hidden">
    <div class="crop-modal-content">
      <h3>Ajustar foto</h3>
      <p>Posicione a imagem antes de confirmar.</p>

      <div class="cropper-container-wrapper">
        <img id="cropperImage" alt="Imagem para recorte">
      </div>

      <div class="crop-controls">
        <label for="zoomRange">Zoom</label>
        <input id="zoomRange" type="range" min="1" max="3" step="0.01" value="1">
      </div>

      <div class="crop-modal-actions">
        <button type="button" id="cancelCropBtn" class="crop-cancel-btn">Cancelar</button>
        <button type="button" id="confirmCropBtn" class="crop-confirm-btn">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <script src="scripts/cropImage.js"></script>
  <script src="scripts/auth.js"></script>
</body>

</html>
