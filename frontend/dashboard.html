<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>EZSaldo • Dashboard</title>
  <link rel="stylesheet" href="style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

  <div id="globalLoader" class="loader hidden">
  <div class="spinner"></div>
</div>

  <!-- HEADER -->
  <header class="dashboard-header">
    <div class="logo-header">
      <span class="ez">EZ</span><span class="saldo">Saldo</span>
    </div>

    <button id="logoutBtn" class="logout-btn">Sair</button>
  </header>

  <!-- MAIN -->
  <main class="dashboard">

    <!-- SALDO -->
    <section class="card saldo-card">
      <h3>Saldo Atual</h3>
      <p id="balance">R$ 0.00</p>
    </section>

    <!-- NOVA TRANSAÇÃO -->
    <section class="card">
      <h3>Nova Transação</h3>

      <form id="transactionForm">

        <!-- DESCRIÇÃO COM CONTADOR -->
        <div class="input-group">
          <input 
            type="text" 
            id="description" 
            placeholder="Descrição (opcional)"
            maxlength="40"
          >
          <small id="charCount">0/40</small>
        </div>

        <input 
          type="number" 
          id="amount" 
          placeholder="Valor (use negativo para gasto)" 
          step="0.01" 
          required
        >

        <button type="submit">Adicionar</button>
      </form>
    </section>

    <!-- LISTA -->
    <section class="card">
      <h3>Transações</h3>
      <ul id="transactionsList"></ul> 
    </section>

  </main>

  <!-- MODAL LOGOUT -->
<div id="logoutModal" class="modal hidden">
  <div class="modal-content">
    <p>Tem certeza que deseja fazer o logout?</p>

    <div class="modal-actions">
      <button id="confirmLogout">Sim</button>
      <button id="cancelLogout">Não</button>
    </div>
  </div>
</div>

<div id="deleteModal" class="modal hidden">
  <div class="modal-content">
    <p>Tem certeza que deseja excluir esta transação?</p>

    <div class="modal-actions">
      <button id="confirmDelete">Sim</button>
      <button id="cancelDelete">Não</button>
    </div>
  </div>
</div>

  <script src="dashboard.js"></script>

</body>
</html>
