<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>EZSaldo • Entrar</title>
  <link rel="stylesheet" href="style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

  <div id="globalLoader" class="loader hidden">
  <div class="spinner"></div>
</div>

  <!-- Logo fora do container -->
  <div class="main-logo">
    <span class="ez">EZ</span><span class="saldo">Saldo</span>
  </div>

  <div class="container">
    <h2>Entrar</h2>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Senha" required>
      <button type="submit">Entrar</button>
      <p id="loginError" class="error-message"></p>
    </form>

    <p>Não tem conta? <a href="register.html">Criar conta</a></p>
  </div>

  <script src="auth.js"></script>
</body>
</html>
